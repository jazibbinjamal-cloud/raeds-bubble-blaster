<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A bubble shooting game designed and drawn by Raed, age 6.">
<meta name="theme-color" content="#fbfaf4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bubble Blaster">
<title>Raed's Bubble Blaster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: one notebook sheet sized by script to fill the screen, wide when sideways and tall when upright; HUD and overlays drawn in pencil style. Single deliberate look (paper), so no dark variant. */
:root {
  --paper: #fbfaf4;
  --rule: #b9cde3;
  --margin: #e7a3a3;
  --pencil: #3b3a3f;
  --soft: #6d6b74;
  --bubble: #5fb7e8;
  --pop: #f2a33a;
  --font-hand: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  --font-body: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme: light;
}
html, body { height: 100%; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background: #e9e6da;
  color: var(--pencil);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  position: relative;
  height: 100%;
  display: grid; place-items: center;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  box-sizing: border-box;
}
.sheet {
  position: relative;
  width: 100%; height: 100%;
  max-width: 100%; max-height: 100%;
  box-shadow: 0 2px 0 #d8d3c2, 0 10px 30px rgba(60, 50, 30, .18);
  border-radius: 4px;
  overflow: hidden;
  background: var(--paper);
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: safe center;
  background: rgba(251, 250, 244, .82);
  text-align: center;
  padding: 4%;
  overflow-y: auto;
}
.card { display: grid; gap: .6em; justify-items: center; max-width: 34em; }
.card h1, .card h2 {
  font-family: var(--font-hand); font-weight: 400; margin: 0;
  font-size: clamp(28px, 6.5vw, 64px); line-height: 1; text-wrap: balance;
}
.card h2 { font-size: clamp(26px, 5.5vw, 54px); }
.card p { margin: 0; font-size: clamp(15px, 2.3vw, 24px); line-height: 1.3; color: var(--soft); text-wrap: balance; }
.card .by { font-size: clamp(13px, 1.8vw, 18px); }
.btn {
  font-family: var(--font-hand); font-size: clamp(22px, 3.6vw, 36px);
  color: var(--pencil); background: #ffe28a;
  border: 3px solid var(--pencil); border-radius: 18px 14px 20px 12px;
  padding: .25em 1.2em; margin-top: .3em; cursor: pointer;
  box-shadow: 3px 4px 0 var(--pencil);
  transition: transform .08s;
}
.btns { display: flex; gap: .8em; flex-wrap: wrap; justify-content: center; }
.btn.alt { background: #d7eefa; font-size: clamp(18px, 2.8vw, 28px); }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--pencil); }
.btn:focus-visible { outline: 3px dashed var(--bubble); outline-offset: 4px; }
.how { display: flex; gap: 1.4em; flex-wrap: wrap; justify-content: center; font-size: clamp(13px, 1.9vw, 19px); color: var(--soft); }
.how b { color: var(--pencil); font-weight: 400; }
@media (pointer: coarse) { .keys-only { display: none; } }
.btns.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5em .8em; }
.btns.levels .btn { margin-top: 0; padding-inline: .6em; white-space: nowrap; }
.btns.levels .btn:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; min-width: 50%; }
.btn.locked { background: #ece9df; color: var(--soft); border-style: dashed; box-shadow: 2px 2px 0 #b8b4a8; }
.linkish {
  font-family: var(--font-body); font-size: clamp(13px, 1.7vw, 16px); color: #a9a6ad;
  background: none; border: 0; padding: .3em .6em; cursor: pointer; text-decoration: underline dotted;
}
.math { display: flex; flex-wrap: wrap; gap: .4em .6em; align-items: center; justify-content: center; }
.math .btn { margin-top: 0; }
.math .msg { flex-basis: 100%; margin: 0; }
@media (max-height: 480px) {
  .card { gap: .35em; }
  .card h2 { font-size: clamp(22px, 4.5vw, 34px); }
  .btn { font-size: clamp(18px, 3vw, 26px); }
}
.math label { font-family: var(--font-hand); font-size: clamp(24px, 4.5vw, 40px); }
.math input {
  font-family: var(--font-hand); font-size: clamp(22px, 4vw, 34px); width: 4.5em; text-align: center;
  border: 3px solid var(--pencil); border-radius: 10px; padding: .1em .3em; background: #fff; color: var(--pencil);
}
.math input:focus-visible { outline: 3px dashed var(--bubble); outline-offset: 3px; }
.math .msg { min-height: 1.3em; color: #c8452f; }
</style>
</head>
<body style="margin:0">

<div class="stage">
  <div class="sheet" id="sheet">
    <canvas id="game" aria-label="Bubble game: tap to move Raed and shoot bubbles"></canvas>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h1>Raed's Bubble Blaster</h1>
        <p>The bubble maker is blowing bubbles! Pop <b>28 bubbles</b> in <b>2 minutes</b>.</p>
        <div class="how">
          <span><b>Tap</b> where you want to shoot</span>
          <span>6 pellets, then <b>reload</b></span>
          <span class="keys-only"><b>↑ ↓</b> to move, <b>Space</b> to shoot</span>
        </div>
        <div class="btns levels">
          <button class="btn" id="lvl1Btn" type="button" data-level="1">Level 1</button>
          <button class="btn" id="lvl2Btn" type="button" data-level="2">Level 2</button>
          <button class="btn" id="lvl3Btn" type="button" data-level="3">Level 3</button>
          <button class="btn" id="lvl4Btn" type="button" data-level="4">Level 4</button>
          <button class="btn" id="lvl5Btn" type="button" data-level="5">Level 5</button>
        </div>
        <p class="by">Game idea and drawings by Raed</p>
      </div>
    </div>

    <div class="overlay" id="endScreen" hidden>
      <div class="card">
        <h2 id="endTitle">You did it!</h2>
        <p id="endText"></p>
        <div class="btns">
          <button class="btn" id="againBtn" type="button">Play again</button>
          <button class="btn alt" id="homeBtn" type="button">All levels</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="lockScreen" hidden>
      <div class="card">
        <h2 id="lockTitle">Level 2 is locked</h2>
        <p id="lockText">Win level 1 to open it.</p>
        <button class="btn" id="lockOk" type="button">OK</button>
        <button class="linkish" id="grownUpBtn" type="button">Grown-up unlock</button>
        <form class="math" id="mathForm" hidden>
          <label for="mathAns" id="mathQ">47 + 28 = ?</label>
          <input id="mathAns" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-describedby="mathMsg">
          <button class="btn alt" type="submit">Unlock</button>
          <p class="msg" id="mathMsg" role="status"></p>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const GOAL = 28, TIME = 120, MAX_LEVEL = 5;
  // time between new bubbles, as a share of the normal gap (smaller = more bubbles), tuned by play-testing
  // level 5 gets its own number for upright phones, where bubbles take longer to rise into reach
  const SPAWN_RATE = { 4: 1.45, 5: 3.3 }, SPAWN_RATE_UPRIGHT = { 5: 0.9 };
  // The play area adapts to the screen: wide when the phone is sideways, tall when upright.
  let W = 960, H = 540, portrait = false, TOP = 54, KID_X = 120, Y_MIN = 120, Y_MAX = 455;
  let MACHINE = { x: 780, y: 470 };
  let BAR_MIN = 80, BAR_MAX = 440, GHOST_MIN = 110, GHOST_MAX = 440;
  const GHOST_SIZE = 2 / 3; // ghost drawn and touch-tested at two thirds of its first size

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const endTitle = document.getElementById('endTitle');
  const endText = document.getElementById('endText');

  // ---------- sizing ----------
  let scale = 1;
  const sheet = document.getElementById('sheet');
  const stage = sheet.parentElement;
  function layout() {
    const sw = Math.max(1, stage.clientWidth), sh = Math.max(1, stage.clientHeight);
    // remember where things are as a share of the old play area, so turning the phone keeps them in place
    const oldW = W, oldH = H, frac = (v, a, b) => (b > a ? (v - a) / (b - a) : 0.5);
    const kidF = kidY !== undefined ? frac(kidY, Y_MIN, Y_MAX) : 0.5, tgtF = kidY !== undefined ? frac(targetY, Y_MIN, Y_MAX) : 0.5;
    const npcF = npc ? frac(npc.y, npcMinY(), npcMaxY()) : 0.5;
    for (const bar of barriers) { bar.fy = frac(bar.y, BAR_MIN + bar.h / 2, BAR_MAX - bar.h / 2); bar.y = undefined; }
    portrait = sh > sw;
    W = portrait ? 560 : 960;
    H = Math.round(Math.min(Math.max(W * sh / sw, W * 0.5), W * (portrait ? 2.1 : 0.75)));
    const fit = Math.min(sw / W, sh / H);
    sheet.style.width = (W * fit) + 'px';
    sheet.style.height = (H * fit) + 'px';
    TOP = portrait ? 92 : 54;
    KID_X = portrait ? 80 : 120;
    Y_MIN = TOP + 66; Y_MAX = H - 85;
    MACHINE = { x: W - (portrait ? 150 : 180), y: H - 70 };
    BAR_MIN = TOP + 26; BAR_MAX = H - 100;
    GHOST_MIN = TOP + 56; GHOST_MAX = H - 100;
    if (kidY !== undefined) {
      kidY = Y_MIN + kidF * (Y_MAX - Y_MIN);
      targetY = Y_MIN + tgtF * (Y_MAX - Y_MIN);
      for (const bar of barriers) placeBarrier(bar);
      if (npc) npc.y = npc.targetY = npcMinY() + npcF * (npcMaxY() - npcMinY());
      if (oldW !== W || oldH !== H) {
        for (const b of bubbles) { b.x *= W / oldW; b.y *= H / oldH; }
        if (ghost) { ghost.x *= W / oldW; ghost.y *= H / oldH; }
        shots = [];
        if (npc) { npc.inFlight = 0; npc.target = null; }
      }
    }
  }
  function placeBarrier(bar) {
    const band = BAR_MAX - BAR_MIN;
    bar.x = KID_X + bar.fx * (MACHINE.x - KID_X);
    // same size on screen as on a laptop, so tall phones don't get extra-long barriers
    bar.h = portrait ? 76 : band * 0.2;
    bar.y = Math.max(BAR_MIN + bar.h / 2, Math.min(BAR_MAX - bar.h / 2, bar.y ?? BAR_MIN + bar.h / 2 + bar.fy * (band - bar.h)));
    bar.v = Math.sign(bar.v) * bar.speed * band / 360;
  }
  function resize() {
    layout();
    paper = null;
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    scale = canvas.width / W;
  }
  window.addEventListener('resize', resize);
  // coming back after the phone was locked or the tab was hidden: redraw everything from scratch
  function wake() { if (document.hidden) return; resize(); wakeAudio(); last = performance.now(); }
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('pageshow', wake);
  canvas.addEventListener('contextrestored', () => { paper = null; });

  // ---------- pencil helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  function wobblyLine(x1, y1, x2, y2, j = 1.2, passes = 2) {
    for (let p = 0; p < passes; p++) {
      ctx.beginPath();
      ctx.moveTo(x1 + rnd(-j, j), y1 + rnd(-j, j));
      const mx = (x1 + x2) / 2 + rnd(-j, j), my = (y1 + y2) / 2 + rnd(-j, j);
      ctx.quadraticCurveTo(mx, my, x2 + rnd(-j, j), y2 + rnd(-j, j));
      ctx.stroke();
    }
  }
  // stable jitter so drawings don't shimmer every frame
  function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

  // ---------- paper background (cached) ----------
  let paper = null;
  function buildPaper() {
    paper = document.createElement('canvas');
    paper.width = canvas.width; paper.height = canvas.height;
    const p = paper.getContext('2d');
    p.scale(scale, scale);
    p.fillStyle = '#fbfaf4'; p.fillRect(0, 0, W, H);
    p.strokeStyle = '#b9cde3'; p.lineWidth = 1.4;
    for (let y = TOP + 16; y < H; y += 40) { p.beginPath(); p.moveTo(0, y); p.lineTo(W, y); p.stroke(); }
    p.strokeStyle = '#e7a3a3'; p.lineWidth = 1.6;
    p.beginPath(); p.moveTo(48, 0); p.lineTo(48, H); p.stroke();
    p.strokeStyle = '#4a4950'; p.lineWidth = 3;
    p.beginPath(); p.moveTo(0, TOP); p.lineTo(W, TOP - 4); p.stroke();
    // paper grain
    const r = seeded(7);
    p.fillStyle = 'rgba(120,110,90,0.05)';
    for (let i = 0; i < 900; i++) p.fillRect(r() * W, r() * H, 1.2, 1.2);
  }

  // ---------- sound ----------
  let audio = null;
  function wakeAudio() { try { if (audio && audio.state !== 'running') audio.resume(); } catch (e) {} }
  function initAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { audio = null; }
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  const sfx = {
    shoot: () => tone(880, 0.09, 'square', 0.05, -500),
    pop: () => { tone(rnd(500, 700), 0.12, 'sine', 0.22, 600); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'triangle', 0.15), i * 130)),
    reload: () => [0, 120].forEach(d => setTimeout(() => tone(140, 0.08, 'square', 0.07), d)),
    ready: () => tone(1200, 0.08, 'triangle', 0.1, 300),
    giggle: () => [0, 110, 220].forEach((d, i) => setTimeout(() => tone(620 + i * 90, 0.09, 'triangle', 0.09, -120), d)),
    whoosh: () => {
      if (!audio) return;
      try {
        const t = audio.currentTime, len = 0.7, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
        const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
        src.buffer = buf; f.type = 'bandpass'; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(1600, t + len);
        g.gain.setValueAtTime(0.35, t);
        src.connect(f).connect(g).connect(audio.destination); src.start(t);
      } catch (e) {}
    },
    npcPop: () => tone(rnd(260, 320), 0.12, 'square', 0.06, 200),
    oops: () => tone(180, 0.25, 'sawtooth', 0.08, -80),
    lose: () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.12), i * 180)),
  };

  // ---------- game state ----------
  let state = 'menu';
  let level = 1, nextLevel = 1, barriers = [], ghost = null, ghostTimer = 0, npc = null, girl = null, teacher = null;
  // Level 1: the teacher visits once per visit, the first time Raed reaches 10 pops
  const TEACHER_STAY = 10;
  let teacherSeen = false;
  try { teacherSeen = sessionStorage.getItem('rbb-teacher') === '1'; } catch (e) {}
  const pickGap = () => (Math.random() < 0.5 ? 5 : 10);
  const GIRL_MIN_BUBBLES = 3;
  const GIRL_LINES = ["I'm not letting you win!", 'Bye-bye bubbles!', 'Too slow, Raed!', 'Watch this!', 'My bubbles now!', 'Whoosh time!'];
  const npcX = () => W - (portrait ? 64 : 100);
  const npcMaxY = () => MACHINE.y - 145; // keeps his feet above the foam
  const npcMinY = () => Y_MIN + 24;
  // Level 4: Raed can only move in the same up-and-down range as the naughty kid
  const kidLo = () => (level === 4 ? npcMinY() : Y_MIN);
  const kidHi = () => (level === 4 ? npcMaxY() : Y_MAX);
  let kidY, targetY, shots, bubbles, pops, popped, timeLeft, spawnTimer, cooldown, recoil, machinePuff, autoFire;
  const keys = {};

  // ---------- locked levels ----------
  // Unlocks last for this visit only: sessionStorage is cleared when the tab or browser is closed.
  let unlocked = 1;
  try { unlocked = Math.min(MAX_LEVEL, Math.max(1, parseInt(sessionStorage.getItem('rbb-unlocked'), 10) || 1)); } catch (e) {}
  const levelBtns = [1, 2, 3, 4, 5].map(n => document.getElementById('lvl' + n + 'Btn'));
  function renderLevels() {
    levelBtns.forEach((b, i) => {
      const n = i + 1, open = n <= unlocked;
      b.classList.toggle('locked', !open);
      b.textContent = open ? `Level ${n}` : `🔒 Level ${n}`;
      b.setAttribute('aria-label', open ? `Play level ${n}` : `Level ${n}, locked`);
    });
  }
  function unlock(n) {
    unlocked = Math.max(unlocked, Math.min(MAX_LEVEL, n));
    try { sessionStorage.setItem('rbb-unlocked', String(unlocked)); } catch (e) {}
    renderLevels();
  }

  function reset() {
    kidY = targetY = Math.round((kidLo() + kidHi()) / 2);
    shots = []; bubbles = []; pops = [];
    popped = 0; timeLeft = TIME; spawnTimer = 0.4; cooldown = 0; recoil = 0; machinePuff = 0; autoFire = false;
    ammo = CLIP; reloadT = 0;
    // Level 2: slow moving barriers (from Raed's level 2 drawing)
    barriers = level === 2 ? [
      { fx: 0.36, fy: 0.25, speed: 34, v: 1 },
      { fx: 0.53, fy: 0.78, speed: 28, v: -1 },
      { fx: 0.70, fy: 0.42, speed: 40, v: 1 },
      { fx: 0.86, fy: 0.70, speed: 32, v: -1 },
    ] : [];
    barriers.forEach(placeBarrier);
    // Level 3: a ghost zig-zags in from the right (from Raed's level 3 drawing)
    ghost = null; ghostTimer = 3;
    teacher = null;
    // Level 5: the naughty girl blows every bubble away every 5 or 10 seconds
    girl = { y: Math.round((npcMinY() + npcMaxY()) / 2), timer: pickGap(), talk: 0, line: '', puff: 0, blow: 0, look: 0 };
    // Level 4: the naughty kid on the right pops 38 to 42 bubbles in 2 minutes (from Raed's whiteboard drawing)
    npc = { y: Math.round((npcMinY() + npcMaxY()) / 2), targetY: 0, cooldown: 1.5, recoil: 0, popped: 0, inFlight: 0,
            goal: 38 + Math.floor(Math.random() * 5), target: null, wander: 0 };
    npc.targetY = npc.y;
  }

  // Ghost up/down speed grows with the height of the play area, so tall phone screens stay challenging.
  function GV() { return portrait ? 150 * Math.max(1, (H - TOP) / (540 - 54)) * 0.95 : 150; }

  function spawnGhost() {
    const y = rnd(GHOST_MIN + 30, GHOST_MAX - 40);
    ghost = { x: W + 60, y, vx: -rnd(120, 150) * (portrait ? 0.75 : 1), vy: Math.random() < 0.5 ? -GV() : GV(), zig: rnd(0.55, 0.8), zt: 0, t: 0 };
  }

  function updateGhost(dt) {
    if (!ghost) {
      ghostTimer -= dt;
      if (ghostTimer <= 0) spawnGhost();
      return;
    }
    const g = ghost;
    g.t += dt; g.zt += dt;
    // zig-zag: flip up/down every so often, leaning toward the kid
    // final 10% of the way to the kid: stop zig-zagging and fly straight, so he can dodge
    const startX = W + 60, finalX = KID_X + (startX - KID_X) * 0.1;
    if (g.x <= finalX) g.vy = 0;
    else if (g.zt > g.zig) {
      g.zt = 0;
      g.vy = kidY - 20 > g.y ? GV() : -GV();
      if (Math.random() < 0.3) g.vy = -g.vy;
    }
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    if (g.y < GHOST_MIN) { g.y = GHOST_MIN; g.vy = GV(); }
    if (g.y > GHOST_MAX) { g.y = GHOST_MAX; g.vy = -GV(); }
    // touch test: ghost body vs the kid's body
    const kidTop = kidY - 86, kidBot = kidY + 52, kidL = KID_X - 26, kidR = KID_X + 60;
    const gL = g.x - 38 * GHOST_SIZE, gR = g.x + 38 * GHOST_SIZE, gT = g.y - 42 * GHOST_SIZE, gB = g.y + 40 * GHOST_SIZE;
    if (gR > kidL && gL < kidR && gB > kidTop && gT < kidBot) return end(false, true);
    if (g.x < -80) { ghost = null; ghostTimer = portrait ? rnd(0.8, 1.8) : rnd(1.5, 3); }
  }

  function updateNpc(dt) {
    const n = npc;
    n.cooldown -= dt; n.recoil = Math.max(0, n.recoil - dt * 6);
    n.y = Math.max(npcMinY(), Math.min(npcMaxY(), n.y));
    // keep his score on pace for his goal, so he ends near 38 to 42 pops
    const want = Math.min(n.goal, n.goal * (TIME - timeLeft) / TIME + 0.8);
    if (n.target && (n.target.dead || !bubbles.includes(n.target) || n.target.x > npcX() - 50)) { n.target = null; n.sniping = false; }
    // Sneaky sniper: he watches Raed's aim line and tries to pop that bubble first
    const aimY = kidY - 8;
    if (n.sniping && n.target && Math.abs(n.target.y - aimY) > n.target.r + 24) { n.target = null; n.sniping = false; }
    if (!n.sniping && n.popped + n.inFlight < Math.min(n.goal, want + 8)) {
      let snipe = null;
      for (const b of bubbles) {
        if (b.x > npcX() - 70 || b.x < KID_X + 120) continue;
        if (Math.abs(b.y - aimY) > b.r + 12) continue;
        if (b.y < npcMinY() - 30 || b.y > npcMaxY() + 20) continue;
        if (!snipe || b.x > snipe.x) snipe = b;
      }
      if (snipe) { n.target = snipe; n.sniping = true; }
    }
    if (!n.target && n.popped + n.inFlight < want) {
      let best = null, bestD = Infinity;
      for (const b of bubbles) {
        if (b.x > npcX() - 70 || b.x < KID_X + 120 || b.y < Y_MIN - 30 || b.y > npcMaxY() + 20) continue;
        const d = Math.abs(b.y - (n.y - 8));
        if (d < bestD) { bestD = d; best = b; }
      }
      n.target = best;
    }
    if (n.target) n.targetY = n.target.y + 8;
    else if ((n.wander -= dt) <= 0) { n.wander = rnd(1, 2.5); n.targetY = rnd(npcMinY(), npcMaxY()); }
    n.targetY = Math.max(npcMinY(), Math.min(npcMaxY(), n.targetY));
    const d = n.targetY - n.y;
    n.y += Math.sign(d) * Math.min(Math.abs(d), (n.sniping ? 650 : 480) * dt);
    if (n.target && n.cooldown <= 0 && Math.abs(n.y - 8 - n.target.y) < n.target.r * 0.5) {
      shots.push({ x: npcX() - 70, y: n.y - 8, len: 0, npc: true, snipe: n.sniping });
      n.inFlight++; n.cooldown = n.sniping ? 0.4 : 0.6; n.recoil = 1; n.target = null; n.sniping = false;
    }
  }

  function updateGirl(dt) {
    const g = girl;
    g.timer -= dt; g.blow = Math.max(0, g.blow - dt);
    // she moves to the height where most bubbles are
    if ((g.look -= dt) <= 0) {
      g.look = 0.3;
      let bestY = g.y, best = -1;
      for (const a of bubbles) {
        if (a.blown) continue;
        let c = 0;
        for (const b of bubbles) if (!b.blown && Math.abs(b.y - a.y) < 80) c++;
        if (c > best) { best = c; bestY = a.y + 8; }
      }
      g.targetY = bestY;
    }
    const lo = npcMinY(), hi = npcMaxY();
    const ty = Math.max(lo, Math.min(hi, g.targetY ?? g.y));
    g.y += Math.sign(ty - g.y) * Math.min(Math.abs(ty - g.y), 320 * dt);
    g.y = Math.max(lo, Math.min(hi, g.y));
    // after her 5 or 10 seconds she waits for at least 3 bubbles and lines up with them,
    // then says a cheeky line for 2 seconds (cheeks puffed for the last one) and blows
    const live = bubbles.filter(b => !b.blown).length;
    if (g.talk <= 0 && g.timer <= 0 && live >= GIRL_MIN_BUBBLES && Math.abs(ty - g.y) < 30) {
      g.talk = 2; { const pool = GIRL_LINES.filter(s => s !== g.last); g.line = g.last = pool[Math.floor(Math.random() * pool.length)]; }
    }
    if (g.talk > 0) g.talk -= dt;
    g.puff = g.talk > 0 && g.talk <= 1 ? 1 : 0;
    if (g.line && g.talk <= 0) {
      g.line = '';
      for (const b of bubbles) {
        b.blown = true; b.ty = undefined;
        if (Math.random() < 0.5) { b.vx = -rnd(650, 950); b.vy = rnd(-140, 100); }
        else { b.vy = -rnd(520, 760); b.vx = -rnd(60, 260); }
      }
      g.blow = 0.8; g.timer = pickGap(); g.talk = 0;
      sfx.whoosh();
    }
  }

  function spawnBubble() {
    const r = rnd(20, 34);
    const x0 = MACHINE.x + rnd(-40, 30), y0 = MACHINE.y - 60;
    let vx = rnd(-95, -35), vy = rnd(-70, -35);
    if (portrait) {
      // tall screens: aim each bubble at a random height so they spread over the whole page
      vx = rnd(-95, -50);
      const targetY = rnd(TOP + 50, H - 170);
      const t = Math.max(1, (x0 - (KID_X + 80)) / -vx) * 0.75;
      vy = (targetY - y0) / t;
    }
    let ty;
    if (level === 4) {
      // level 4: send every bubble up into the range both kids can reach, then let it drift
      vx = rnd(-95, -50);
      ty = rnd(kidLo() - 20, kidHi() - 4);
      const t = Math.max(0.8, (x0 - (KID_X + 80)) / -vx) * 0.35;
      vy = (ty - y0) / t;
    }
    bubbles.push({
      x: x0, y: y0, ty,
      vx, vy,
      r, phase: rnd(0, Math.PI * 2), wob: rnd(0.8, 1.6),
      hue: [200, 190, 280, 330, 160, 45][Math.floor(rnd(0, 6))],
      seed: Math.floor(rnd(1, 99999)), grow: 0,
    });
    machinePuff = 1;
  }

  // Every level: the blaster holds 6 pellets, then takes 2 seconds to reload
  const CLIP = 6, RELOAD_TIME = 2;
  let ammo = CLIP, reloadT = 0;
  function shoot() {
    if (cooldown > 0) return;
    {
      if (reloadT > 0) return;
      ammo--;
      if (ammo <= 0) { reloadT = RELOAD_TIME; sfx.reload(); }
    }
    cooldown = 0.28; recoil = 1;
    shots.push({ x: KID_X + 70, y: kidY - 8, len: 0 });
    sfx.shoot();
  }

  // ---------- update ----------
  function update(dt) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; return end(false); }

    // movement
    const speed = 420;
    if (keys.up) targetY = kidY - speed * dt;
    if (keys.down) targetY = kidY + speed * dt;
    targetY = Math.max(kidLo(), Math.min(kidHi(), targetY));
    const diff = targetY - kidY;
    kidY += Math.sign(diff) * Math.min(Math.abs(diff), 900 * dt);
    if (autoFire && Math.abs(targetY - kidY) < 2) { autoFire = false; shoot(); }
    if (keys.fire) shoot();

    cooldown -= dt; recoil = Math.max(0, recoil - dt * 6); machinePuff = Math.max(0, machinePuff - dt * 3);
    if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { reloadT = 0; ammo = CLIP; sfx.ready(); } }

    // spawn: a bit faster as time goes on, plenty of bubbles to reach 28
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const progress = 1 - timeLeft / TIME;
      spawnTimer = (rnd(0.9, 1.5) - progress * 0.3) * ((portrait && SPAWN_RATE_UPRIGHT[level]) || SPAWN_RATE[level] || 1);
      if (bubbles.length < 9) spawnBubble();
    }

    for (const b of bubbles) {
      b.phase += dt * b.wob * 2;
      b.grow = Math.min(1, b.grow + dt * 2.5);
      b.x += (b.vx + Math.sin(b.phase) * 30) * dt;
      b.y += (b.vy + Math.cos(b.phase * 0.7) * 22) * dt;
      if (b.ty !== undefined && b.y <= b.ty) { b.vy = rnd(-12, 12); b.ty = undefined; }
      if (b.blown) continue; // blown bubbles fly straight off the screen
      // keep bubbles in the play area by bouncing gently off the top line
      if (b.y - b.r < TOP + 8) { b.y = TOP + 8 + b.r; b.vy = Math.abs(b.vy) * 0.6 + 10; }
      if (b.y + b.r > H - 8) { b.vy = -Math.abs(b.vy); }
    }
    bubbles = bubbles.filter(b => (b.blown ? b.x + b.r > 0 && b.y + b.r > TOP - 30 : b.x + b.r > KID_X + 40));

    // pellets: Raed's fly right, the naughty kid's fly left; pellets never hurt either kid
    for (const s of shots) { s.x += (s.npc ? -1100 : 1100) * dt; s.len = Math.min(46, s.len + 600 * dt); }
    if (level === 4 && state === 'play') updateNpc(dt);

    for (const bar of barriers) {
      bar.y += bar.v * dt;
      if (bar.y - bar.h / 2 < BAR_MIN) { bar.y = BAR_MIN + bar.h / 2; bar.v = Math.abs(bar.v); }
      if (bar.y + bar.h / 2 > BAR_MAX) { bar.y = BAR_MAX - bar.h / 2; bar.v = -Math.abs(bar.v); }
      for (const s of shots) {
        if (s.dead || s.npc) continue;
        if (s.x >= bar.x - 5 && s.x - s.len <= bar.x + 5 && Math.abs(s.y - bar.y) <= bar.h / 2 + 3) {
          s.dead = true; bar.hit = 1;
          popped = Math.max(0, popped - 1);
          pops.push({ x: bar.x, y: s.y, r: 18, t: 0, minus: true });
          sfx.oops();
        }
      }
      bar.hit = Math.max(0, (bar.hit || 0) - dt * 3);
    }

    // hits
    for (const s of shots) {
      for (const b of bubbles) {
        if (b.dead || s.dead) continue;
        const x1 = s.npc ? s.x : s.x - s.len, x2 = s.npc ? s.x + s.len : s.x;
        const nearestX = Math.max(x1, Math.min(b.x, x2));
        const dx = b.x - nearestX, dy = b.y - s.y;
        if (dx * dx + dy * dy < (b.r + 4) * (b.r + 4)) {
          b.dead = s.dead = true;
          if (s.npc) { npc.popped++; npc.inFlight--; } else popped++;
          pops.push({ x: b.x, y: b.y, r: b.r, t: 0, hue: b.hue, npc: s.npc, label: s.snipe ? 'Hee hee!' : null });
          if (s.snipe) sfx.giggle(); else if (s.npc) sfx.npcPop(); else sfx.pop();
        }
      }
    }
    bubbles = bubbles.filter(b => !b.dead);
    for (const s of shots) if (s.npc && !s.dead && s.x + s.len < 0) { s.dead = true; npc.inFlight--; }
    shots = shots.filter(s => !s.dead && s.x - s.len < W);
    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 0.5);

    if (level === 3 && state === 'play') updateGhost(dt);
    if (level === 5 && state === 'play') updateGirl(dt);
    if (level === 1) {
      if (!teacherSeen && popped >= 10) {
        teacherSeen = true; teacher = { t: 0 };
        try { sessionStorage.setItem('rbb-teacher', '1'); } catch (e) {}
      }
      if (teacher) { teacher.t += dt; if (teacher.t > TEACHER_STAY + 2) teacher = null; }
    }
    if (state === 'play' && popped >= GOAL) end(true);
  }

  function end(won, caught) {
    state = 'over';
    const used = Math.round(TIME - timeLeft);
    const clock = `${Math.floor(used / 60)}:${String(used % 60).padStart(2, '0')}`;
    const againBtn = document.getElementById('againBtn');
    if (won) unlock(level + 1);
    if (won && level === 1) {
      endTitle.textContent = 'Level 1 done!';
      endText.textContent = `You popped all ${GOAL} bubbles in ${clock}. Level 2 has moving barriers. Hitting a barrier takes away 1 point!`;
      againBtn.textContent = 'Go to level 2';
      nextLevel = 2;
    } else if (won && level === 2) {
      endTitle.textContent = 'Level 2 done!';
      endText.textContent = `You popped all ${GOAL} bubbles in ${clock}, even with the barriers. Level 3 has a ghost. If it touches you, you are OUT!`;
      againBtn.textContent = 'Go to level 3';
      nextLevel = 3;
    } else if (won && level === 3) {
      endTitle.textContent = 'Level 3 done!';
      endText.textContent = `You popped all ${GOAL} bubbles in ${clock} and the ghost never got you. In level 4 a naughty kid tries to pop the bubbles first!`;
      againBtn.textContent = 'Go to level 4';
      nextLevel = 4;
    } else if (won && level === 4) {
      endTitle.textContent = 'Level 4 done!';
      endText.textContent = `You popped all ${GOAL} bubbles in ${clock}. The naughty kid only got ${npc.popped}. In level 5 a naughty girl blows the bubbles away!`;
      againBtn.textContent = 'Go to level 5';
      nextLevel = 5;
    } else if (won) {
      endTitle.textContent = 'You beat all 5 levels, hero!';
      endText.textContent = `You popped all ${GOAL} bubbles in ${clock}, even with the naughty girl blowing them away.`;
      againBtn.textContent = 'Play again';
      nextLevel = 1;
    } else if (caught) {
      endTitle.textContent = 'OUT! The ghost got you!';
      endText.textContent = `You popped ${popped} of ${GOAL} bubbles. Move up and down to get away from the ghost.`;
      againBtn.textContent = 'Try level 3 again';
      nextLevel = 3;
    } else {
      endTitle.textContent = "Time's up!";
      endText.textContent = level === 4
        ? `You popped ${popped} of ${GOAL} bubbles. The naughty kid popped ${npc.popped}! Try again!`
        : `You popped ${popped} of ${GOAL} bubbles on level ${level}. Try again!`;
      againBtn.textContent = `Try level ${level} again`;
      nextLevel = level;
    }
    (won ? sfx.win : sfx.lose)();
    setTimeout(() => { endScreen.hidden = false; document.getElementById('againBtn').focus(); }, won ? 600 : 300);
  }

  // ---------- drawing ----------
  // dir 1 faces right (Raed), dir -1 faces left (the naughty kid)
  function drawKid(x = KID_X, y = kidY, rec = recoil * 6, dir = 1, naughty = false) {
    ctx.save();
    ctx.translate(x, 0); ctx.scale(dir, 1); x = 0;
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const r = seeded(11);
    const j = () => (r() - 0.5) * 1.5;
    // head
    ctx.beginPath(); ctx.arc(x + j(), y - 62, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 1, y - 62, 21, 0.2, Math.PI * 2.1); ctx.stroke();
    ctx.fillStyle = '#3b3a3f';
    if (naughty) {
      // the little ball above his head from Raed's whiteboard drawing
      ctx.beginPath(); ctx.ellipse(x, y - 102, 7, 5, 0, 0, Math.PI * 2); ctx.stroke();
      // spiky hair, cheeky eyebrows and a sideways grin
      ctx.beginPath(); ctx.moveTo(x - 18, y - 74);
      for (let i = 0; i < 5; i++) { ctx.lineTo(x - 14 + i * 8, y - 92); ctx.lineTo(x - 10 + i * 8, y - 80); }
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 12, y - 74); ctx.lineTo(x - 2, y - 70); ctx.moveTo(x + 14, y - 75); ctx.lineTo(x + 5, y - 70); ctx.stroke();
      ctx.beginPath(); ctx.arc(x - 6, y - 65, 2.4, 0, 7); ctx.arc(x + 9, y - 65, 2.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 6, y - 55); ctx.quadraticCurveTo(x + 6, y - 50, x + 13, y - 59); ctx.stroke();
    } else {
      // hair scribble
      ctx.beginPath(); ctx.moveTo(x - 14, y - 78); ctx.quadraticCurveTo(x - 4, y - 90, x + 10, y - 80); ctx.stroke();
      // eyes + smile
      ctx.beginPath(); ctx.arc(x - 6, y - 66, 2.4, 0, 7); ctx.arc(x + 9, y - 66, 2.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 2, y - 60, 9, 0.3, Math.PI - 0.3); ctx.stroke();
    }
    // body + legs
    ctx.beginPath(); ctx.moveTo(x, y - 40); ctx.lineTo(x + j(), y + 18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.lineTo(x - 18, y + 52); ctx.moveTo(x, y + 18); ctx.lineTo(x + 18, y + 52); ctx.stroke();
    // arm to blaster
    ctx.beginPath(); ctx.moveTo(x - 22, y - 10); ctx.lineTo(x + 30 - rec, y - 10); ctx.stroke();
    // blaster (like Raed's drawing)
    const gx = x + 30 - rec, gy = y - 30;
    ctx.fillStyle = naughty ? '#f4a6a0' : '#ffe28a';
    ctx.beginPath();
    ctx.moveTo(gx, gy); ctx.lineTo(gx + 44, gy); ctx.lineTo(gx + 44, gy + 16);
    ctx.lineTo(gx + 22, gy + 16); ctx.lineTo(gx + 20, gy + 46); ctx.lineTo(gx + 4, gy + 46); ctx.lineTo(gx + 6, gy + 16); ctx.lineTo(gx, gy + 16);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx + 6, gy + 4); ctx.lineTo(gx + 38, gy + 4); ctx.stroke();
    ctx.restore();
  }

  function drawAmmo() {
    // 6 pellet dots under Raed, or a reload bar while the blaster refills
    const x = KID_X - 30, y = Math.min(kidY + 74, H - 12);
    ctx.save();
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 2;
    if (reloadT > 0) {
      ctx.fillStyle = '#3b3a3f'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '18px "Patrick Hand", "Comic Sans MS", cursive';
      ctx.fillText('Reloading…', x, y - 2);
      ctx.strokeRect(x, y + 10, 76, 9);
      ctx.fillStyle = '#f2a33a';
      ctx.fillRect(x + 1.5, y + 11.5, 73 * (1 - reloadT / RELOAD_TIME), 6);
    } else {
      for (let i = 0; i < CLIP; i++) {
        ctx.fillStyle = i < ammo ? '#f2a33a' : 'transparent';
        ctx.beginPath(); ctx.arc(x + 6 + i * 13, y + 6, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawTeacher() {
    const k = teacher.t, stopX = W - (portrait ? 74 : 120), offX = W + 90;
    const x = k < 1 ? offX + (stopX - offX) * k : k > TEACHER_STAY + 1 ? stopX + (offX - stopX) * (k - TEACHER_STAY - 1) : stopX;
    const y = TOP + 100, walking = k < 1 || k > TEACHER_STAY + 1;
    const step = walking ? Math.sin(k * 14) * 8 : 0;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3;
    // long dark hair behind her
    ctx.fillStyle = '#2f2a2e';
    ctx.beginPath(); ctx.ellipse(x + 2, y - 52, 25, 32, 0, 0, Math.PI * 2); ctx.fill();
    // shalwar legs
    ctx.beginPath(); ctx.moveTo(x - 6, y + 22); ctx.lineTo(x - 10 - step * 0.5, y + 52); ctx.moveTo(x + 6, y + 22); ctx.lineTo(x + 10 + step * 0.5, y + 52); ctx.stroke();
    // kameez: a long tunic with little dots
    ctx.fillStyle = '#7cc6b8';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 40); ctx.lineTo(x + 12, y - 40); ctx.lineTo(x + 22, y + 26); ctx.lineTo(x - 22, y + 26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff6d8';
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(x - 12 + (i % 3) * 12, y - 20 + Math.floor(i / 3) * 22, 2.2, 0, 7); ctx.fill(); }
    // arms: one holds a book, one waves
    ctx.beginPath(); ctx.moveTo(x - 10, y - 32); ctx.lineTo(x - 30, y - 12); ctx.moveTo(x + 10, y - 32); ctx.lineTo(x + 26, y - 48 + Math.sin(k * 6) * 4); ctx.stroke();
    ctx.fillStyle = '#e7a3a3'; ctx.fillRect(x - 42, y - 22, 16, 20); ctx.strokeRect(x - 42, y - 22, 16, 20);
    // dupatta: a pink scarf over the shoulders
    ctx.strokeStyle = '#e88fb4'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x - 16, y - 34); ctx.quadraticCurveTo(x, y - 22, x + 16, y - 36); ctx.quadraticCurveTo(x + 22, y - 10, x + 18, y + 8); ctx.stroke();
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3;
    // face
    ctx.fillStyle = '#fbf3ea';
    ctx.beginPath(); ctx.arc(x, y - 62, 19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2f2a2e';
    ctx.beginPath(); ctx.moveTo(x - 19, y - 64); ctx.quadraticCurveTo(x - 6, y - 90, x + 19, y - 66); ctx.quadraticCurveTo(x + 4, y - 76, x - 19, y - 64); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 7, y - 62, 2.3, 0, 7); ctx.arc(x + 6, y - 62, 2.3, 0, 7); ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x - 10, y - 66); ctx.lineTo(x - 12, y - 68); ctx.moveTo(x + 9, y - 66); ctx.lineTo(x + 11, y - 68); ctx.stroke();
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(x - 1, y - 56, 6, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.fillStyle = 'rgba(232,143,180,0.45)';
    ctx.beginPath(); ctx.arc(x - 12, y - 55, 3.5, 0, 7); ctx.arc(x + 11, y - 55, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2c14e';
    ctx.beginPath(); ctx.arc(x - 19, y - 55, 2.6, 0, 7); ctx.arc(x + 19, y - 55, 2.6, 0, 7); ctx.fill();
    // speech bubble once she has arrived
    if (!walking) {
      const msg = 'Good work, but this is the only easy level!';
      ctx.font = `${portrait ? 21 : 22}px "Gochi Hand", "Comic Sans MS", cursive`;
      const maxW = portrait ? 210 : 260, words = msg.split(' '), lines = [];
      let line = '';
      for (const w of words) { const tryL = line ? line + ' ' + w : w; if (ctx.measureText(tryL).width > maxW && line) { lines.push(line); line = w; } else line = tryL; }
      lines.push(line);
      const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 28, bh = lines.length * 26 + 18;
      const bx = x - 44 - bw, by = y - 98;
      ctx.fillStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(bx + 14, by); ctx.lineTo(bx + bw - 14, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + 14);
      ctx.lineTo(bx + bw, by + bh * 0.45); ctx.lineTo(bx + bw + 22, by + bh * 0.55); ctx.lineTo(bx + bw, by + bh * 0.7);
      ctx.lineTo(bx + bw, by + bh - 14); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - 14, by + bh);
      ctx.lineTo(bx + 14, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - 14); ctx.lineTo(bx, by + 14); ctx.quadraticCurveTo(bx, by, bx + 14, by);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3b3a3f'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      lines.forEach((l, i) => ctx.fillText(l, bx + 14, by + 10 + i * 26));
    }
    ctx.restore();
  }

  // a pencil speech bubble whose tail points right, toward whoever is talking
  function speech(msg, rightX, topY, maxW) {
    ctx.save();
    ctx.font = `${portrait ? 21 : 22}px "Gochi Hand", "Comic Sans MS", cursive`;
    const lines = [];
    let line = '';
    for (const w of msg.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    lines.push(line);
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 28, bh = lines.length * 26 + 18;
    const bx = Math.max(8, rightX - 22 - bw), by = topY;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + 14, by); ctx.lineTo(bx + bw - 14, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + 14);
    ctx.lineTo(bx + bw, by + bh * 0.45); ctx.lineTo(bx + bw + 22, by + bh * 0.6); ctx.lineTo(bx + bw, by + bh * 0.72);
    ctx.lineTo(bx + bw, by + bh - 14); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - 14, by + bh);
    ctx.lineTo(bx + 14, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - 14); ctx.lineTo(bx, by + 14); ctx.quadraticCurveTo(bx, by, bx + 14, by);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c8452f'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, bx + 14, by + 10 + i * 26));
    ctx.restore();
  }

  function drawGirl() {
    const g = girl, x = npcX(), y = g.y;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3;
    // wind lines while she blows
    if (g.blow > 0) {
      const a = g.blow / 0.8;
      ctx.strokeStyle = `rgba(95,183,232,${0.75 * a})`; ctx.lineWidth = 3;
      for (let i = 0; i < 7; i++) {
        const yy = y - 58 + (i - 3) * 28 * (1.6 - a), len = (1 - a) * (x - KID_X) + 80;
        ctx.beginPath(); ctx.moveTo(x - 30, y - 58 + (i - 3) * 4);
        ctx.bezierCurveTo(x - 30 - len * 0.3, yy - 20, x - 30 - len * 0.6, yy + 20, x - 30 - len, yy);
        ctx.stroke();
      }
      ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3;
    }
    // long wavy hair down to her shoulders, drawn behind the head
    ctx.fillStyle = '#5a3b2e';
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 88);
    ctx.bezierCurveTo(x - 34, y - 90, x - 30, y - 66, x - 32, y - 56);
    for (let i = 0; i < 3; i++) ctx.quadraticCurveTo(x - 40 + (i % 2) * 14, y - 48 + i * 7, x - 30 + (i % 2) * 2, y - 40 + i * 7);
    ctx.quadraticCurveTo(x - 20, y - 22, x - 10, y - 30);
    ctx.lineTo(x + 10, y - 30);
    ctx.quadraticCurveTo(x + 20, y - 22, x + 30, y - 26);
    for (let i = 2; i >= 0; i--) ctx.quadraticCurveTo(x + 40 - (i % 2) * 14, y - 34 - (2 - i) * 7, x + 30 - (i % 2) * 2, y - 40 - (2 - i) * 7);
    ctx.bezierCurveTo(x + 30, y - 66, x + 34, y - 90, x - 4, y - 88);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // frock, arms and legs
    ctx.beginPath(); ctx.moveTo(x, y - 40); ctx.lineTo(x, y - 20); ctx.stroke();
    ctx.fillStyle = '#f7b6cf';
    ctx.beginPath(); ctx.moveTo(x - 6, y - 30); ctx.lineTo(x + 6, y - 30); ctx.lineTo(x + 22, y + 16); ctx.lineTo(x - 22, y + 16); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, y + 16); ctx.lineTo(x - 10, y + 52); ctx.moveTo(x + 6, y + 16); ctx.lineTo(x + 10, y + 52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 4, y - 26); ctx.lineTo(x - 22, y - 6); ctx.moveTo(x + 4, y - 26); ctx.lineTo(x + 22, y - 8); ctx.stroke();
    // head: puffed cheeks before blowing, cheeky smile otherwise
    const puff = g.puff > 0 || g.blow > 0;
    ctx.fillStyle = puff ? '#ffd9d2' : '#fbfaf4';
    ctx.beginPath(); ctx.arc(x, y - 62, puff ? 23 : 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // fringe across the forehead
    ctx.fillStyle = '#5a3b2e';
    ctx.beginPath(); ctx.moveTo(x - 19, y - 68); ctx.quadraticCurveTo(x - 8, y - 92, x + 19, y - 70); ctx.quadraticCurveTo(x + 6, y - 78, x - 2, y - 72); ctx.quadraticCurveTo(x - 10, y - 78, x - 19, y - 68); ctx.fill();
    // big pink bow on top
    ctx.fillStyle = '#f06292'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x + 2, y - 86); ctx.lineTo(x - 20, y - 100); ctx.lineTo(x - 18, y - 76); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 2, y - 86); ctx.lineTo(x + 24, y - 100); ctx.lineTo(x + 22, y - 76); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 2, y - 87, 5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.fillStyle = '#3b3a3f';
    ctx.beginPath(); ctx.arc(x - 8, y - 67, 2.3, 0, 7); ctx.arc(x + 6, y - 67, 2.3, 0, 7); ctx.fill();
    // playful arched eyebrows, one raised for a cheeky look
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x - 8, y - 70, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 6, y - 72, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    if (puff) {
      ctx.fillStyle = 'rgba(232,110,140,0.5)';
      ctx.beginPath(); ctx.arc(x - 14, y - 56, 7, 0, 7); ctx.arc(x + 12, y - 56, 7, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3b3a3f';
      ctx.beginPath(); ctx.ellipse(x - 12, y - 54, 4, 3.5, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x - 10, y - 55); ctx.quadraticCurveTo(x - 2, y - 49, x + 9, y - 57); ctx.stroke();
    }
    if (g.line && g.talk > 0) speech(g.line, x - 36, Math.max(TOP + 6, y - 100), portrait ? 170 : 220);
    ctx.restore();
  }

  function drawLevel4Band() {
    // a light stripe shows where both kids can move and aim
    ctx.save();
    ctx.fillStyle = 'rgba(124,200,239,0.10)';
    ctx.fillRect(0, kidLo() - 8 - 30, W, kidHi() - kidLo() + 60);
    ctx.restore();
  }

  function drawNpc() {
    drawKid(npcX(), npc.y, npc.recoil * 6, -1, true);
    ctx.save();
    ctx.restore();
  }

  // A scribbly wash tub piled with foam, the way a 6 year old would draw it
  const FOAM = (() => { const r = seeded(42); return Array.from({ length: 13 }, (_, i) => ({ dx: -100 + i * 17 + (r() - .5) * 8, dy: -(r() * 26), rr: 14 + r() * 12, ph: r() * 6 })); })();
  function drawMachine() {
    const { x, y } = MACHINE;
    const now = performance.now() / 1000, puff = machinePuff;
    ctx.save();
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // handles
    ctx.beginPath(); ctx.ellipse(x - 122, y - 8, 12, 14, 0, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x + 122, y - 8, 12, 14, 0, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
    // tub body: wider at the top, like a bucket
    ctx.fillStyle = '#cfe6f2';
    ctx.beginPath();
    ctx.moveTo(x - 116, y - 26); ctx.lineTo(x + 116, y - 28);
    ctx.lineTo(x + 92, y + 52); ctx.lineTo(x - 90, y + 54); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // scribbled metal bands
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(59,58,63,0.55)';
    ctx.beginPath(); ctx.moveTo(x - 110, y - 8); ctx.lineTo(x + 111, y - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 93, y + 45); ctx.lineTo(x + 94, y + 44); ctx.stroke();
    // little feet
    ctx.lineWidth = 3; ctx.strokeStyle = '#3b3a3f';
    ctx.beginPath(); ctx.moveTo(x - 70, y + 54); ctx.lineTo(x - 74, y + 62); ctx.moveTo(x + 70, y + 53); ctx.lineTo(x + 74, y + 61); ctx.stroke();
    // label
    ctx.fillStyle = '#3b3a3f'; ctx.textAlign = 'center';
    ctx.font = '28px "Gochi Hand", "Comic Sans MS", cursive';
    ctx.fillText('Bubble', x, y + 16);
    ctx.font = '22px "Gochi Hand", "Comic Sans MS", cursive';
    ctx.fillText('maker', x + 6, y + 36);
    // foam pile on top: wobbles all the time and puffs up when a bubble comes out
    ctx.lineWidth = 2.4;
    for (const f of FOAM) {
      const wob = Math.sin(now * 3 + f.ph) * 2;
      const rr = f.rr * (1 + puff * 0.18) + wob * 0.6;
      const cx = x + f.dx, cy = y - 30 + f.dy - puff * 6 + wob;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(95,183,232,0.7)';
      ctx.beginPath(); ctx.arc(cx - rr * 0.25, cy - rr * 0.25, rr * 0.45, Math.PI * 1.05, Math.PI * 1.5); ctx.stroke();
      ctx.strokeStyle = '#3b3a3f';
    }
    ctx.restore();
  }

  function drawBubble(b) {
    const rr = b.r * (0.4 + 0.6 * b.grow) * (1 + Math.sin(b.phase * 1.3) * 0.03);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = `hsla(${b.hue}, 80%, 70%, 0.22)`;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 2.4;
    const r = seeded(b.seed);
    ctx.beginPath(); ctx.arc((r() - .5) * 1.5, (r() - .5) * 1.5, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.4; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc((r() - .5) * 2, (r() - .5) * 2, rr - 1, 0.4, Math.PI * 2 - 0.3); ctx.stroke();
    ctx.globalAlpha = 1;
    // the little cross from Raed's drawing
    ctx.lineWidth = 2; ctx.strokeStyle = `hsl(${b.hue}, 45%, 38%)`;
    const c = rr * 0.55;
    ctx.beginPath(); ctx.moveTo(-c, 0); ctx.lineTo(c, 0); ctx.moveTo(0, -c); ctx.lineTo(0, c); ctx.stroke();
    // shine
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, rr * 0.7, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    ctx.restore();
  }

  function drawGhost() {
    if (!ghost) return;
    const g = ghost;
    ctx.save();
    ctx.translate(g.x, g.y + Math.sin(g.t * 6) * 3);
    ctx.scale(GHOST_SIZE, GHOST_SIZE);
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    // body: rounded top, wavy bottom with three lumps like Raed drew
    ctx.beginPath();
    ctx.moveTo(-40, 30);
    ctx.lineTo(-42, -10);
    ctx.quadraticCurveTo(-42, -48, -6, -48);
    ctx.quadraticCurveTo(38, -50, 40, -12);
    ctx.lineTo(42, 22);
    const w = Math.sin(g.t * 8) * 3;
    ctx.quadraticCurveTo(44, 40, 28, 36);
    ctx.quadraticCurveTo(18, 28 + w, 12, 40);
    ctx.quadraticCurveTo(0, 54, -10, 40);
    ctx.quadraticCurveTo(-16, 28 - w, -24, 38);
    ctx.quadraticCurveTo(-32, 52, -40, 44);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // eyes
    ctx.fillStyle = '#3b3a3f';
    ctx.beginPath(); ctx.ellipse(-14, -26, 3, 5, 0, 0, 7); ctx.ellipse(8, -26, 3, 5, 0, 0, 7); ctx.fill();
    // zig-zag teeth
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-28, -6);
    for (let i = 0; i < 5; i++) { ctx.lineTo(-22 + i * 11, -12); ctx.lineTo(-17 + i * 11, 2); }
    ctx.moveTo(-28, 16);
    for (let i = 0; i < 5; i++) { ctx.lineTo(-22 + i * 11, 0); ctx.lineTo(-17 + i * 11, 16); }
    ctx.stroke();
    ctx.restore();
  }

  function drawBarriers() {
    ctx.save();
    ctx.lineCap = 'round';
    for (const bar of barriers) {
      const top = bar.y - bar.h / 2, bot = bar.y + bar.h / 2;
      ctx.strokeStyle = bar.hit > 0 ? '#c8452f' : '#3b3a3f';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(bar.x, top); ctx.lineTo(bar.x + 2, bot); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(59,58,63,0.5)';
      ctx.beginPath(); ctx.moveTo(bar.x - 4, top + 3); ctx.lineTo(bar.x - 3, bot - 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPop(p) {
    const k = p.t / 0.5;
    if (p.minus) {
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#c8452f'; ctx.textAlign = 'center';
      ctx.font = `${30 + k * 8}px "Gochi Hand", "Comic Sans MS", cursive`;
      ctx.fillText('-1', p.x - 24, p.y - 10 - k * 24);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = `hsl(${p.hue}, 65%, 45%)`; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r1 = p.r * (0.5 + k), r2 = p.r * (0.8 + k * 1.4);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.stroke();
    }
    ctx.fillStyle = p.npc ? '#c8452f' : '#3b3a3f';
    ctx.font = `${26 + k * 10}px "Gochi Hand", "Comic Sans MS", cursive`; ctx.textAlign = 'center';
    ctx.fillText(p.label || 'POP!', 0, -p.r - 6 - k * 16);
    ctx.restore();
  }

  function drawShots() {
    ctx.save();
    ctx.lineCap = 'round';
    for (const s of shots) {
      const x1 = s.npc ? s.x : s.x - s.len, x2 = s.npc ? s.x + s.len : s.x;
      ctx.strokeStyle = s.npc ? '#e0665c' : '#f2a33a'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(x1, s.y); ctx.lineTo(x2, s.y); ctx.stroke();
      ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, s.y); ctx.lineTo(x2, s.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawAim() {
    // faint dotted line shows the straight path of the blaster
    ctx.save();
    ctx.strokeStyle = 'rgba(242,163,58,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([4, 10]);
    ctx.beginPath(); ctx.moveTo(KID_X + 80, kidY - 8); ctx.lineTo(W, kidY - 8); ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.fillStyle = '#3b3a3f'; ctx.textBaseline = 'middle';
    ctx.font = '30px "Gochi Hand", "Comic Sans MS", cursive';
    // bubbles counter with little progress dots
    ctx.textAlign = 'left';
    ctx.fillText(`Popped ${popped} / ${GOAL}`, 64, 28);
    // upright phones put the progress bar and level name on a second row
    const barX = portrait ? 64 : 250, barW = portrait ? W - 64 - 200 : 300, barY = portrait ? 56 : 18;
    ctx.strokeStyle = '#3b3a3f'; ctx.lineWidth = 2.5;
    ctx.strokeRect(barX, barY, barW, 20);
    ctx.fillStyle = '#7cc8ef';
    ctx.fillRect(barX + 2, barY + 2, (barW - 4) * Math.min(1, popped / GOAL), 16);
    // timer
    const t = Math.ceil(timeLeft);
    ctx.textAlign = 'right';
    ctx.fillStyle = t <= 15 ? '#c8452f' : '#3b3a3f';
    ctx.fillText(`⏱ ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`, W - 24, 28);
    ctx.font = '20px "Patrick Hand", "Comic Sans MS", cursive';
    ctx.fillStyle = '#6d6b74';
    ctx.fillText(['', 'Level 1', 'Level 2 · Barriers', 'Level 3 · Ghost', '', 'Level 5 · Naughty girl'][level], portrait ? W - 24 : W - 140, portrait ? 66 : 28);
    if (level === 4 && npc) {
      // level 4 shows the naughty kid's score where the level name usually goes
      ctx.fillStyle = '#c8452f';
      ctx.fillText(`Naughty kid: ${npc.popped}`, portrait ? W - 24 : W - 140, portrait ? 66 : 28);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // always wipe the frame first: if the phone threw away the cached paper while asleep,
    // the old drawings must not pile up on top of each other
    ctx.fillStyle = '#fbfaf4'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!paper || paper.width !== canvas.width || paper.height !== canvas.height) buildPaper();
    ctx.drawImage(paper, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (level === 4 && state !== 'menu') drawLevel4Band();
    drawMachine();
    if (state === 'play') drawAim();
    for (const b of bubbles) drawBubble(b);
    drawBarriers();
    drawShots();
    for (const p of pops) drawPop(p);
    drawKid();
    if (level === 4 && npc) drawNpc();
    if (level === 5 && girl && state !== 'menu') drawGirl();
    if (level === 1 && teacher) drawTeacher();
    if (state !== 'menu') drawAmmo();
    drawGhost();
    drawHUD();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu') {
      // idle animation behind the start card
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnTimer = 1.5; if (bubbles.length < 6) spawnBubble(); }
      for (const b of bubbles) { b.phase += dt * 2; b.grow = Math.min(1, b.grow + dt * 2.5); b.x += (b.vx + Math.sin(b.phase) * 30) * dt; b.y += (b.vy + Math.cos(b.phase * .7) * 22) * dt; if (b.y - b.r < TOP + 8) { b.y = TOP + 8 + b.r; b.vy = Math.abs(b.vy) * .6 + 10; } }
      bubbles = bubbles.filter(b => b.x + b.r > KID_X + 40);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', e => {
    wakeAudio();
    if (state !== 'play') return;
    e.preventDefault();
    const p = toGame(e);
    targetY = Math.max(kidLo(), Math.min(kidHi(), p.y + 8));
    if (Math.abs(targetY - kidY) < 2) shoot(); else autoFire = true;
  });
  const keyMap = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire', Enter: 'fire' };
  window.addEventListener('keydown', e => {
    const k = keyMap[e.code]; if (!k) return;
    wakeAudio();
    if (state === 'play') { e.preventDefault(); keys[k] = true; autoFire = false; }
  });
  window.addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });

  function start(lv) {
    level = lv;
    initAudio();
    reset();
    for (const k in keys) keys[k] = false;
    startScreen.hidden = true; endScreen.hidden = true;
    state = 'play';
    canvas.focus();
  }
  const lockScreen = document.getElementById('lockScreen');
  const mathForm = document.getElementById('mathForm');
  const mathQ = document.getElementById('mathQ'), mathAns = document.getElementById('mathAns'), mathMsg = document.getElementById('mathMsg');
  let lockLevel = 2, mathAnswer = 0;
  function newQuestion() {
    // 2nd grade maths: adding or taking away two-digit numbers within 100
    if (Math.random() < 0.5) {
      const a = Math.floor(rnd(12, 60)), b = Math.floor(rnd(11, 99 - a));
      mathAnswer = a + b; mathQ.textContent = `${a} + ${b} = ?`;
    } else {
      const a = Math.floor(rnd(30, 99)), b = Math.floor(rnd(11, a - 5));
      mathAnswer = a - b; mathQ.textContent = `${a} − ${b} = ?`;
    }
    mathAns.value = '';
  }
  function showLock(n) {
    lockLevel = n;
    document.getElementById('lockTitle').textContent = `🔒 Level ${n} is locked`;
    document.getElementById('lockText').textContent = unlocked === n - 1
      ? `Win level ${n - 1} to open it.`
      : `Win level ${n - 1} to open it. Start with level ${unlocked}.`;
    mathForm.hidden = true; mathMsg.textContent = ''; document.getElementById('lockText').hidden = false;
    document.getElementById('grownUpBtn').hidden = false;
    startScreen.hidden = true; lockScreen.hidden = false;
    document.getElementById('lockOk').focus();
  }
  function closeLock() { lockScreen.hidden = true; startScreen.hidden = false; }
  document.getElementById('lockOk').addEventListener('click', closeLock);
  document.getElementById('grownUpBtn').addEventListener('click', () => {
    newQuestion(); mathForm.hidden = false; document.getElementById('grownUpBtn').hidden = true;
    document.getElementById('lockText').hidden = true; mathAns.focus();
  });
  mathForm.addEventListener('submit', e => {
    e.preventDefault();
    if (parseInt(mathAns.value, 10) === mathAnswer) {
      unlock(lockLevel); closeLock();
    } else {
      mathMsg.textContent = 'Not quite. Try this one instead.';
      newQuestion(); mathAns.focus();
    }
  });
  levelBtns.forEach((b, i) => b.addEventListener('click', () => (i + 1 <= unlocked ? start(i + 1) : showLock(i + 1))));
  document.getElementById('againBtn').addEventListener('click', () => start(nextLevel));
  document.getElementById('homeBtn').addEventListener('click', () => {
    level = 1; reset(); state = 'menu';
    endScreen.hidden = true; startScreen.hidden = false;
  });
  renderLevels();

  resize();
  reset();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { paper = null; });
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
